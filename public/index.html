<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Givetome</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F6F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D100E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Givetome">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:#F6F7F6;--sf:#fff;--tx:#15181A;--mu:#69706B;--ln:#E7E9E7;--fl:#EFF1EF;
  --ac:#14532D;--onac:#fff;--acs:#E3EFE7;--wn:#B6402B;--wns:#FAE9E5;--r:20px}
@media(prefers-color-scheme:dark){:root{
  --bg:#0D100E;--sf:#151916;--tx:#E9EDEA;--mu:#97A09A;--ln:#232825;--fl:#1C211E;
  --ac:#6BD39A;--onac:#0D100E;--acs:#15271D;--wn:#F08A74;--wns:#2B1914}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 'IBM Plex Sans Thai',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide,[hidden]{display:none!important}
.mu{color:var(--mu)}.small{font-size:13px}
.pos{color:var(--ac)}.late{color:var(--wn)!important}

/* ---------- layout ---------- */
.page{max-width:560px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:20px 0 12px}
.tt{flex:1;min-width:0}
.top h1{margin:0;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mu);font-size:13px}
.ic{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;text-decoration:none;padding:0}
.ic.flat{border-color:transparent;background:none}
.load{color:var(--mu);padding:40px 0;text-align:center}

/* ---------- hero & cards ---------- */
.hero{padding:4px 0 20px}
.lb{font-size:13px;color:var(--mu)}
.hero .n{font-size:46px;font-weight:500;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.hero .dc{font-size:22px;color:var(--mu)}
.hero .cur{font-size:22px;color:var(--mu);margin-right:4px}
.card{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px;text-decoration:none}
.card p{margin:6px 0 12px}
.pair{display:grid;grid-template-columns:repeat(var(--c,2),1fr);gap:0}
.pair>div{min-width:0}.pair>div+div{border-left:1px solid var(--ln);padding-left:14px}
.pair.g{row-gap:14px}.pair.g>div:nth-child(odd){border-left:0;padding-left:0}.pair.g>div:nth-child(even){padding-left:14px;border-left:1px solid var(--ln)}
.v{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:block;height:6px;border-radius:3px;background:var(--fl);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .4s ease}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px}
.sec b{font-weight:600;font-size:16px}
.sec a,.lnk{color:var(--ac);font-size:14px;text-decoration:none;background:none;border:0;padding:6px 0}
.gh{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;padding:18px 0 2px}

/* ---------- rows ---------- */
.r{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;text-decoration:none;color:inherit}
button.r,.rb{cursor:pointer}
.rb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left}
.av{width:40px;height:40px;border-radius:50%;background:var(--fl);display:grid;place-items:center;font-size:18px;flex:none;line-height:1}
.mn{flex:1;min-width:0;display:block}
.mn b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn small{display:block;color:var(--mu);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.am small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.vd{opacity:.5}.vd .am{text-decoration:line-through}
.empty{text-align:center;color:var(--mu);padding:44px 12px}
.empty b{display:block;color:var(--tx);font-weight:500;margin-bottom:4px}
.empty .btn{max-width:240px;margin:16px auto 0}

/* ---------- controls ---------- */
.seg{display:flex;gap:2px;padding:3px;background:var(--fl);border-radius:12px}
.seg button{flex:1;min-height:36px;border:0;border-radius:10px;background:none;color:var(--mu);font-size:14px;padding:0 6px}
.seg button.on{background:var(--sf);color:var(--tx);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mon{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.mon b{font-weight:500}
.search{display:flex;align-items:center;gap:8px;background:var(--fl);border-radius:12px;padding:0 12px;color:var(--mu)}
.search input{flex:1;min-width:0;height:44px;border:0;background:none;font-size:16px;color:var(--tx)}
.search input:focus-visible{outline:0}
.search:focus-within{outline:2px solid var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.cb{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 0}
.cb .t{display:flex;justify-content:space-between;gap:10px}
.cb .bar{height:5px;margin-top:7px}
.cb.on .t{color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--ac);color:var(--onac);font-weight:500;font-size:16px;text-decoration:none}
.btn.ghost{background:var(--fl);color:var(--tx)}
.btn.warn{background:var(--wns);color:var(--wn)}
.btn.warn.armed{background:var(--wn);color:#fff}
.btn:disabled{opacity:.55}
.btn+.btn{margin-top:10px}
.ip{display:block;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:var(--fl);font-size:16px;margin-top:12px;appearance:none;-webkit-appearance:none}
.ip:disabled{opacity:.6}
select.ip{margin-top:0;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.fld .ip{margin-top:0}
.serr{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--wns);color:var(--wn);font-size:14px}

/* checklist */
.ckb{width:44px;height:44px;margin:-8px -8px -8px -10px;display:grid;place-items:center;border:0;background:none;padding:0;flex:none}
.ck{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--mu);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ck.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}

/* ---------- nav ---------- */
.nv{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nv div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);align-items:center}
.nv a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 7px;color:var(--mu);font-size:11.5px;text-decoration:none}
.nv a.on{color:var(--ac);font-weight:500}
#add{width:50px;height:50px;border-radius:50%;border:0;background:var(--ac);color:var(--onac);display:grid;place-items:center;justify-self:center;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent)}

/* ---------- sheet ---------- */
dialog.sheet{border:0;padding:0;background:var(--sf);color:var(--tx);width:100%;max-width:560px;max-height:92dvh;margin:auto auto 0;border-radius:24px 24px 0 0;overflow:auto;animation:up .22s ease-out}
dialog.sheet::backdrop{background:rgba(8,12,10,.5)}
@media(min-width:600px){dialog.sheet{margin:auto;border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#sc{padding:8px 20px calc(22px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--ln);margin:4px auto 14px}
#sc h2{margin:0 0 4px;font-size:20px;font-weight:600}
.meta{color:var(--mu);font-size:13px;text-align:center;margin-bottom:4px}
.amtbox{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 4px}
.amtbox span{font-size:26px;color:var(--mu)}
.amt{width:min(220px,60vw);border:0;background:none;text-align:center;font-size:42px;font-weight:500;letter-spacing:-.02em;padding:0;font-variant-numeric:tabular-nums}
.amt:focus-visible{outline:0}.amt::placeholder{color:var(--ln)}

/* ---------- auth ---------- */
.authbox{max-width:380px;margin:0 auto;padding:12vh 24px 40px}
.brand{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.tag{margin:2px 0 28px;color:var(--mu)}
#af .btn{margin-top:18px}
.hint{font-size:13px;color:var(--mu);margin:8px 0 0}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#off{display:none;background:var(--wn);color:#fff;text-align:center;padding:6px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<div id="off">ออฟไลน์ — บันทึกรายการไม่ได้จนกว่าจะเชื่อมต่อ</div>

<section id="auth" class="hide">
  <div class="authbox">
    <div class="brand">Givetome</div>
    <p class="tag">สมุดบัญชีส่วนตัว</p>
    <div class="seg" id="aseg"><button type="button" data-r="0" class="on">เข้าสู่ระบบ</button><button type="button" data-r="1">สร้างบัญชี</button></div>
    <form id="af" novalidate>
      <label class="fld"><span>อีเมล</span><input id="em" class="ip" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required></label>
      <label class="fld"><span>รหัสผ่าน</span><input id="pw" class="ip" type="password" autocomplete="current-password" required></label>
      <p class="hint" id="ahint" hidden>อย่างน้อย 10 ตัวอักษร · ข้อมูลของแต่ละบัญชีแยกกัน คนอื่นมองไม่เห็น</p>
      <p class="serr" id="aerr" role="alert" hidden></p>
      <button class="btn" id="asub" type="submit">เข้าสู่ระบบ</button>
    </form>
  </div>
</section>

<section id="app" class="hide">
  <main class="page" id="v"></main>
  <nav class="nv" aria-label="เมนูหลัก"><div id="nvi"></div></nav>
</section>

<dialog id="sheet" class="sheet" aria-modal="true"><div id="sc"></div></dialog>

<script>
'use strict';
/* ====================== helpers ====================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=s=>NF.format(Number(s)), C=s=>Math.round(Number(s)*100), fm=c=>NF.format(c/100), fc=c=>(c/100).toFixed(2);
const big=s=>{const p=NF.format(Number(s)).split('.');return `<span class="n">${p[0]}</span><span class="dc">.${p[1]}</span>`};
const enc=encodeURIComponent, iso=d=>enc(d.toISOString());
const TL={INCOME:'รายรับ',EXPENSE:'รายจ่าย',TRANSFER:'โอน',REFUND:'รับคืน',ADJUST:'ปรับยอด'};
const EXP=['อาหาร','เดินทาง','ค่าห้อง/น้ำไฟ','ค่าโทรศัพท์/เน็ต','ซื้อของ','ผ่อนหนี้','ความบันเทิง','สุขภาพ','การเรียน','เงินออม','อื่น ๆ'];
const INC=['เงินเดือน','โบนัส','อื่น ๆ'];
const KINDS=['ใช้จ่าย','เงินเดือน','เงินออม','เงินสด','กระเป๋าเงิน'];
const CI={'อาหาร':'🍜','เดินทาง':'🚌','ค่าห้อง/น้ำไฟ':'🏠','ค่าโทรศัพท์/เน็ต':'📱','ซื้อของ':'🛍️','ผ่อนหนี้':'💳','ความบันเทิง':'🎬','สุขภาพ':'💊','การเรียน':'📚','เงินออม':'🐷','เงินเดือน':'💼','โบนัส':'🎁'};
const KI={'ใช้จ่าย':'💳','เงินเดือน':'💼','เงินออม':'🐷','เงินสด':'💵','กระเป๋าเงิน':'👛'};
const svg=(p,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:svg('<path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10v9.5h13V10"/>'),
  list:svg('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>',26),
  bills:svg('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9.5 15 1.8 1.8 3.4-3.6"/>'),
  wallet:svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.8" r=".8"/>'),
  left:svg('<path d="m14.5 6-6 6 6 6"/>',20), right:svg('<path d="m9.5 6 6 6-6 6"/>',20),
  user:svg('<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',20),
  search:svg('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>',18),
  check:svg('<path d="m5.5 12.5 4.5 4.5 8.5-9.5"/>',16)
};
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'k'+Date.now()+Math.random().toString(16).slice(2);
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const loc=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};

/* dates / months */
const cur=()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}};
const shift=(o,n)=>{const d=new Date(o.y,o.m+n,1);return{y:d.getFullYear(),m:d.getMonth()}};
const range=o=>[new Date(o.y,o.m,1),new Date(o.y,o.m+1,0,23,59,59,999)];
const key=o=>`${o.y}-${String(o.m+1).padStart(2,'0')}`;
const mlabel=o=>new Date(o.y,o.m,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const ymd=d=>d.toLocaleDateString('en-CA');
const short=d=>new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const tm=d=>new Date(d).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
function dayLabel(d,yr){const t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(!yr&&ymd(d)===ymd(t))return'วันนี้';if(!yr&&ymd(d)===ymd(y))return'เมื่อวาน';
  return d.toLocaleDateString('th-TH',yr?{day:'numeric',month:'short',year:'2-digit'}:{weekday:'short',day:'numeric',month:'short'})}
function groups(txs){const m=new Map();for(const t of txs){const d=new Date(t.occurredAt),k=ymd(d);if(!m.has(k))m.set(k,{d,items:[]});m.get(k).items.push(t)}return[...m.values()]}

/* ====================== state ====================== */
const S={tab:'home',sub:null,sig:'',tok:0,email:'',reg:false,accts:[],tx:new Map(),bills:new Map(),
  mList:cur(),mBills:cur(),mAcct:cur(),seg:'all',cat:'',q:'',showVoid:false};
const an=id=>esc((S.accts.find(a=>a.id===id)||{}).name||'—');
const reg=l=>l.forEach(t=>S.tx.set(t.id,t));

/* ====================== api / ui plumbing ====================== */
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(p,m='GET',b){
  if(!navigator.onLine)throw Error('ออฟไลน์ — เชื่อมต่ออินเทอร์เน็ตก่อนใช้งาน');
  const r=await fetch(p,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!p.startsWith('/api/auth/')){showAuth();throw Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่')}
  if(!r.ok)throw Error(j.error||'เกิดข้อผิดพลาด');return j}
async function load(){const a=await api('/api/accounts');S.accts=a.accounts;return a}

const errBox='<p class="serr" id="serr" role="alert" hidden></p>';
function sheet(html,mount){$('sc').innerHTML=html;const d=$('sheet');if(!d.open)d.showModal();
  $('sc').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&$('sv')){e.preventDefault();$('sv').click()}};mount&&mount()}
const closeSheet=()=>{const d=$('sheet');d.open&&d.close()};
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
function fail(e){const el=$('serr');if(el&&$('sheet').open){el.textContent=e.message;el.hidden=false}else toast(e.message)}
async function run(btn,fn){if(btn.disabled)return;btn.disabled=true;try{await fn()}catch(e){fail(e)}finally{btn.disabled=false}}
function arm(btn,fn){const t=btn.textContent;let on=false,h;btn.onclick=()=>{
  if(!on){on=true;btn.textContent='แตะอีกครั้งเพื่อยืนยัน';btn.classList.add('armed');
    h=setTimeout(()=>{on=false;btn.textContent=t;btn.classList.remove('armed')},3500);return}
  clearTimeout(h);run(btn,fn)}}
function chips(list,sel,id){return `<div class="chips" id="${id}">${list.map(c=>`<button type="button" class="chip${c===sel?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
function bindChips(id,fn){const el=$(id);if(!el)return;el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const was=b.classList.contains('on');
  el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));if(!was)b.classList.add('on');fn&&fn(chipVal(id))}}
const chipVal=id=>{const b=$(id)&&$(id).querySelector('.chip.on');return b?b.dataset.c:''};
const moneyOk=s=>/^\d{1,12}(\.\d{1,2})?$/.test(s);
const cleanAmt=s=>String(s).replace(/[,\s฿]/g,'');

/* ====================== shared view parts ====================== */
const head=(t,sub='',back='')=>`<header class="top">${back?`<a class="ic flat" href="${back}" aria-label="กลับ">${I.left}</a>`:''}<div class="tt"><h1>${esc(t)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div><button class="ic" data-me aria-label="บัญชีผู้ใช้">${I.user}</button></header>`;
const monthBar=(o,id)=>`<div class="mon"><button class="ic flat" data-m="${id}" data-d="-1" aria-label="เดือนก่อนหน้า">${I.left}</button><b>${mlabel(o)}</b><button class="ic flat" data-m="${id}" data-d="1" aria-label="เดือนถัดไป">${I.right}</button></div>`;

function row(t,o={}){
  const vd=t.status==='VOID',tr=t.type==='TRANSFER',inc=t.type==='INCOME'||t.type==='REFUND';
  let amt,cls='';
  if(o.signed!==undefined){const n=Number(o.signed);amt=(n>=0?'+':'−')+fmt(Math.abs(n));if(n>0)cls='pos'}
  else if(t.type==='EXPENSE')amt='−'+fmt(t.amount);
  else if(inc){amt='+'+fmt(t.amount);cls='pos'}else amt=fmt(t.amount);
  let where;
  if(o.acct){where=tr?(t.toAccountId===o.acct?'จาก '+an(t.fromAccountId):'ไป '+an(t.toAccountId)):esc(t.category||TL[t.type])}
  else where=tr?`${an(t.fromAccountId)} → ${an(t.toAccountId)}`:`${t.category?esc(t.category)+' · ':''}${an(t.fromAccountId||t.toAccountId)}`;
  const when=o.date?short(t.occurredAt)+' '+tm(t.occurredAt):tm(t.occurredAt);
  const av=tr?'⇄':(CI[t.category]||(inc?'＋':'🧾'));
  return `<button class="r${vd?' vd':''}" data-tx="${esc(t.id)}"><span class="av">${av}</span><span class="mn"><b>${esc(t.title)}</b><small>${where} · ${when}${t.billOccurrenceId?' · บิลประจำ':''}${vd?' · ยกเลิกแล้ว':''}</small>${t.note?`<small>${esc(t.note)}</small>`:''}</span><span class="am ${cls}">${amt}${o.running?`<small>คงเหลือ ${fmt(o.running)}</small>`:''}</span></button>`}

async function vList(){
  await load();
  const html=`${head('รายการ')}
  <div class="search">${I.search}<input id="q" placeholder="ค้นหาชื่อรายการ" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search" aria-label="ค้นหา"></div>
  <div class="seg" id="sg" style="margin-top:12px">${[['all','ทั้งหมด'],['EXPENSE','รายจ่าย'],['INCOME','รายรับ']].map(([k,t])=>`<button data-s="${k}"${S.seg===k?' class="on"':''}>${t}</button>`).join('')}</div>
  <div id="lb"></div>`;
  return{html,mount(){
    const lb=$('lb');let n=0;
    async function fill(){
      const my=++n,searching=S.q.trim()!=='',p=new URLSearchParams();
      if(searching){p.set('search',S.q.trim());p.set('limit','200')}else{const[a,b]=range(S.mList);p.set('from',a.toISOString());p.set('to',b.toISOString())}
      let all;try{all=await api('/api/transactions?'+p)}catch(e){if(my===n)lb.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
      if(my!==n)return;reg(all);
      const posted=all.filter(t=>t.status==='POSTED'),voided=all.filter(t=>t.status==='VOID');
      const isExp=t=>t.type==='EXPENSE',isInc=t=>t.type==='INCOME'||t.type==='REFUND';
      const f=t=>(S.seg==='all'||(S.seg==='EXPENSE'?isExp(t):isInc(t)))&&(!S.cat||(t.category||'ไม่ระบุหมวด')===S.cat);
      let inc=0,exp=0;posted.forEach(t=>{if(isExp(t))exp+=C(t.amount);else if(isInc(t))inc+=C(t.amount)});
      const shown=[...posted.filter(f),...(S.showVoid?voided.filter(f):[])].sort((x,y)=>new Date(y.occurredAt)-new Date(x.occurredAt));
      let top='';
      if(searching)top=`<p class="mu small" style="margin:14px 0 0">พบ ${shown.length} รายการ</p>`;
      else{
        const now=new Date(),cm=cur(),isNow=S.mList.y===cm.y&&S.mList.m===cm.m,past=S.mList.y*12+S.mList.m<cm.y*12+cm.m;
        const days=isNow?now.getDate():past?new Date(S.mList.y,S.mList.m+1,0).getDate():0;
        top=monthBar(S.mList,'mList')+`<div class="card"><div class="pair" style="--c:3"><div><div class="lb">รายรับ</div><div class="v pos">${fm(inc)}</div></div><div><div class="lb">รายจ่าย</div><div class="v">${fm(exp)}</div></div><div><div class="lb">สุทธิ</div><div class="v">${fm(inc-exp)}</div></div></div>${exp&&days?`<p class="mu small" style="margin:12px 0 0">ใช้จ่ายเฉลี่ยวันละ ฿${fm(exp/days)}</p>`:''}</div>`;
        if(S.seg==='EXPENSE'){const m=new Map();posted.filter(isExp).forEach(t=>{const k=t.category||'ไม่ระบุหมวด';m.set(k,(m.get(k)||0)+C(t.amount))});
          const arr=[...m].sort((a,b)=>b[1]-a[1]);
          if(arr.length)top+=`<div class="card">${arr.map(([k,v])=>`<button class="cb${S.cat===k?' on':''}" data-cat="${esc(k)}"><span class="t"><span>${CI[k]||'•'} ${esc(k)}</span><b>฿${fm(v)}</b></span><span class="bar"><i style="width:${Math.max(3,v/exp*100)}%"></i></span></button>`).join('')}</div>`}
      }
      const clear=S.cat?`<div style="margin-top:6px"><button class="chip on" data-clearcat>${esc(S.cat)} ✕</button></div>`:'';
      const body=groups(shown).map(g=>{const de=g.items.filter(t=>t.status==='POSTED'&&isExp(t)).reduce((s,t)=>s+C(t.amount),0);
        return `<div class="gh"><span>${dayLabel(g.d,searching)}</span><span>${de?'−'+fm(de):''}</span></div>${g.items.map(t=>row(t,{date:searching})).join('')}`}).join('')
        ||`<div class="empty"><b>${searching?'ไม่พบรายการ':'ยังไม่มีรายการในเดือนนี้'}</b>${searching?'ลองค้นหาด้วยคำอื่น':'กด + เพื่อบันทึกรายการ'}</div>`;
      const vb=voided.length?`<div style="text-align:center;margin-top:8px"><button class="lnk" data-showvoid>${S.showVoid?'ซ่อน':'แสดง'}รายการที่ยกเลิก (${voided.length})</button></div>`:'';
      lb.innerHTML=top+clear+body+vb}
    lb.onclick=e=>{const c=e.target.closest('[data-cat]');
      if(c){S.cat=S.cat===c.dataset.cat?'':c.dataset.cat;fill();return}
      if(e.target.closest('[data-clearcat]')){S.cat='';fill();return}
      if(e.target.closest('[data-showvoid]')){S.showVoid=!S.showVoid;fill()}};
    $('sg').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;S.seg=b.dataset.s;S.cat='';
      $('sg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fill()};
    $('q').oninput=debounce(()=>{S.q=$('q').value;fill()},250);
    fill()}}}

async function vReports(){
  const now=new Date(),today=ymd(now);
  return{html:`${head('รายงานการเงิน')}
  <div class="card">
    <label class="fld" style="margin:0"><span>ช่วงเวลารายงาน</span><select id="rp" class="ip"><option value="YEAR">ปีนี้</option><option value="MONTH">เดือนนี้</option><option value="WEEK">สัปดาห์นี้</option><option value="DAY">วันนี้</option></select></label>
    <label class="fld" id="rdatewrap" hidden><span>วันที่อ้างอิง</span><input id="rdate" class="ip" type="date" value="${today}"></label>
    <div class="pair" style="margin-top:14px"><div><div class="lb">เงินเข้า</div><div class="v pos" id="ri">฿0.00</div></div><div><div class="lb">เงินออก</div><div class="v" id="re">฿0.00</div></div></div>
    <div style="border-top:1px solid var(--ln);margin-top:14px;padding-top:12px"><div class="lb">ยอดสุทธิ</div><div class="v" id="rn">฿0.00</div></div>
    <p class="mu small" id="rperiod" style="margin:8px 0 0"></p>
  </div>
  <div class="sec"><b>สรุปรายรับ–รายจ่าย</b></div><div class="card" id="rchart"><div class="mu small">กำลังโหลด…</div></div>
  <div class="sec"><b>รายจ่ายแยกตามหมวดหมู่</b></div><div class="card" id="rcat"><div class="mu small">กำลังโหลด…</div></div>
  <a class="btn ghost" id="rexport" href="/api/export/transactions.csv" download>ส่งออก CSV ของช่วงเวลานี้</a>
  <p class="mu small">นับเฉพาะรายการที่บันทึกสำเร็จ รายการโอนระหว่างบัญชีไม่นับเป็นรายรับหรือรายจ่าย เพื่อไม่ให้นับเงินซ้ำ</p>`,mount(){
    const $id=id=>document.getElementById(id),money=v=>'฿'+fmt(v);
    function period(){const mode=$id('rp').value,d=new Date(($id('rdate').value||today)+'T12:00:00');let a,b;
      if(mode==='YEAR'){a=new Date(d.getFullYear(),0,1);b=new Date(d.getFullYear()+1,0,1)}
      else if(mode==='MONTH'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,1)}
      else if(mode==='WEEK'){const day=(d.getDay()+6)%7;a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);b=new Date(a);b.setDate(a.getDate()+7)}
      else if(mode==='DAY'){a=new Date(d.getFullYear(),d.getMonth(),d.getDate());b=new Date(a);b.setDate(a.getDate()+1)}
      else{a=new Date(($id('rfrom')?.value||today)+'T00:00:00');b=new Date(($id('rto')?.value||today)+'T00:00:00');b.setDate(b.getDate()+1)}
      return{a,b};}
    async function fill(){try{const {a,b}=period(),from=a.toISOString(),to=new Date(b.getTime()-1).toISOString();
      const d=await api('/api/summary?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to));
      $id('ri').textContent=money(d.income);$id('re').textContent=money(d.expense);$id('rn').textContent=money(d.net);$id('rn').className='v '+(C(d.net)>=0?'pos':'late');
      $id('rperiod').textContent=a.toLocaleDateString('th-TH',{dateStyle:'medium'})+' – '+new Date(b-1).toLocaleDateString('th-TH',{dateStyle:'medium'})+' · '+d.count+' รายการ';
      const chartRows=$id('rp').value==='YEAR'?Object.values(d.byDay.reduce((m,x)=>{const k=x.date.slice(0,7),v=m[k]||(m[k]={date:k,income:0,expense:0});v.income+=C(x.income);v.expense+=C(x.expense);return m},{})):d.byDay;
      const max=Math.max(1,...chartRows.flatMap(x=>[C(x.income),C(x.expense)]));
      $id('rchart').innerHTML=chartRows.length?chartRows.map(x=>`<div style="margin:8px 0"><div class="pair"><div class="small">${esc(x.date)}</div><div class="small" style="text-align:right">เข้า ${fmt(x.income)} · ออก ${fmt(x.expense)}</div></div><div style="display:flex;gap:3px;margin-top:4px"><i style="height:7px;border-radius:4px;background:var(--ac);width:${C(x.income)/max*100}%"></i></div><div style="display:flex;gap:3px;margin-top:3px"><i style="height:7px;border-radius:4px;background:var(--wn);width:${C(x.expense)/max*100}%"></i></div></div>`).join(''):'<div class="empty">ไม่มีรายการในช่วงเวลานี้</div>';
      $id('rcat').innerHTML=d.byCategory.length?d.byCategory.map(x=>`<div class="pair" style="padding:7px 0"><div>${esc(x.name)}</div><b style="text-align:right">${money(x.amount)}</b></div>`).join(''):'<div class="mu small">ยังไม่มีรายจ่าย</div>';
      $id('rexport').href='/api/export/transactions.csv?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to);
    }catch(e){$id('rchart').textContent=e.message}}
    $id('rp').onchange=()=>{$id('rdatewrap').hidden=$id('rp').value==='YEAR';fill()};$id('rdate').onchange=fill;fill();
  }}}

  <div id="cw" style="margin-top:14px"></div>
  <label class="fld" id="fw"><span id="fl"></span><select id="fa" class="ip">${opts(def)}</select></label>
  <label class="fld" id="tw"><span id="tl"></span><select id="ta" class="ip">${opts(other)}</select></label>
  <label class="fld"><span>วันที่และเวลา</span><input id="dt" type="datetime-local" class="ip" value="${loc()}"></label>
  <input id="nt" class="ip" placeholder="โน้ต (ไม่บังคับ) เช่น จ่ายที่ไหน จ่ายด้วยอะไร" maxlength="500" style="margin-top:14px" aria-label="โน้ต">
  ${errBox}<button class="btn" id="sv" style="margin-top:16px">บันทึก</button>`,()=>{
    const paint=(reset)=>{const t=st.type;
      $('tys').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
      $('ti').placeholder={EXPENSE:'จ่ายอะไร เช่น ข้าวมันไก่',INCOME:'รับจากอะไร เช่น เงินเดือน',TRANSFER:'เช่น เติมเงินวอลเล็ต'}[t];
      const list=t==='EXPENSE'?EXP:t==='INCOME'?INC:[];
      if(reset)st.cat='';
      $('cw').innerHTML=list.length?chips(list,st.cat,'cc'):'';bindChips('cc',v=>{st.cat=v});
      $('fw').hidden=t==='INCOME';$('tw').hidden=t==='EXPENSE';
      $('fl').textContent=t==='TRANSFER'?'จากบัญชี':'จ่ายจากบัญชี';$('tl').textContent=t==='TRANSFER'?'ไปยังบัญชี':'เข้าบัญชี';
      if(reset){if(t==='INCOME')$('ta').value=def;if(t==='TRANSFER'&&$('ta').value===$('fa').value)$('ta').value=other}};
    $('tys').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;st.type=b.dataset.t;paint(true)};
    paint(false);
    $('sv').onclick=()=>run($('sv'),async()=>{
      const amount=cleanAmt($('am').value),t=st.type,from=$('fa').value,to=$('ta').value;
      if(!moneyOk(amount)||Number(amount)<=0)throw Error('ใส่จำนวนเงินให้ถูกต้อง เช่น 120 หรือ 120.50');
      if(t==='TRANSFER'&&from===to)throw Error('เลือกบัญชีต้นทางและปลายทางให้ต่างกัน');
      const b={type:t,amount,title:$('ti').value.trim()||st.cat||TL[t],idempotencyKey:idem,
        occurredAt:($('dt').value?new Date($('dt').value):new Date()).toISOString()};
      if(st.cat)b.category=st.cat;if($('nt').value.trim())b.note=$('nt').value.trim();
      if(t!=='INCOME')b.fromAccountId=from;if(t!=='EXPENSE')b.toAccountId=to;
      await api('/api/transactions','POST',b);store.set('acct',t==='INCOME'?to:from);
      closeSheet();toast('บันทึกแล้ว');render()});
    setTimeout(()=>{try{$('am').focus()}catch{}},60)})}

function openTx(id){
  const t=S.tx.get(id);if(!t)return;const ro=t.status==='VOID';
  const list=t.type==='EXPENSE'?EXP:(t.type==='INCOME'||t.type==='REFUND')?INC:[];
  const cats=t.category&&!list.includes(t.category)?[...list,t.category]:list;
  const where=t.type==='TRANSFER'?`${an(t.fromAccountId)} → ${an(t.toAccountId)}`:an(t.fromAccountId||t.toAccountId);
  const dis=ro?' disabled':'';
  sheet(`<div class="grab"></div>
  <div class="meta">${TL[t.type]} · ${where} · ${new Date(t.occurredAt).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}${t.billOccurrenceId?' · บิลประจำ':''}${ro?' · ยกเลิกแล้ว':''}</div>
  <div class="amtbox"><span>฿</span><input id="am" class="amt" inputmode="decimal" value="${esc(String(Number(t.amount)))}"${dis} aria-label="จำนวนเงิน"></div>
  <input id="ti" class="ip" value="${esc(t.title)}" maxlength="120"${dis} aria-label="ชื่อรายการ">
  ${cats.length&&!ro?`<div style="margin-top:14px">${chips(cats,t.category,'cc')}</div>`:''}
  <input id="nt" class="ip" placeholder="โน้ต" value="${esc(t.note||'')}" maxlength="500"${dis} style="margin-top:14px" aria-label="โน้ต">
  ${errBox}${ro?'':`<button class="btn" id="sv" style="margin-top:16px">บันทึกการแก้ไข</button><button class="btn warn" id="vd">ยกเลิกรายการนี้</button>`}`,()=>{
    if(ro)return;let cat=t.category||'';bindChips('cc',v=>{cat=v});
    $('sv').onclick=()=>run($('sv'),async()=>{const amount=cleanAmt($('am').value);
      if(!moneyOk(amount)||Number(amount)<=0)throw Error('ใส่จำนวนเงินให้ถูกต้อง เช่น 120 หรือ 120.50');
      if(!$('ti').value.trim())throw Error('ใส่ชื่อรายการ');
      await api('/api/transactions/'+t.id,'PUT',{amount,title:$('ti').value.trim(),note:$('nt').value.trim()||null,category:cat||null});
      closeSheet();toast('แก้ไขแล้ว');render()});
    arm($('vd'),async()=>{await api('/api/transactions/'+t.id,'DELETE');closeSheet();toast('ยกเลิกรายการแล้ว ยอดบัญชีคำนวณใหม่');render()})})}

function openAcct(){
  let kind='ใช้จ่าย';
  sheet(`<div class="grab"></div><h2>เพิ่มบัญชี</h2>
  <input id="an" class="ip" placeholder="ชื่อบัญชี เช่น กสิกร, เงินสด" maxlength="80" autocomplete="off" aria-label="ชื่อบัญชี">
  <div style="margin-top:14px">${chips(KINDS,kind,'kc')}</div>
  <label class="fld"><span>ยอดตั้งต้น (บาท)</span><input id="ao" class="ip" inputmode="decimal" placeholder="0" autocomplete="off"></label>
  ${errBox}<button class="btn" id="sv" style="margin-top:16px">เพิ่มบัญชี</button>`,()=>{
    bindChips('kc',v=>{kind=v||'ใช้จ่าย'});
    $('sv').onclick=()=>run($('sv'),async()=>{const name=$('an').value.trim(),op=cleanAmt($('ao').value)||'0';
      if(!name)throw Error('ใส่ชื่อบัญชี');if(!moneyOk(op))throw Error('ยอดตั้งต้นต้องเป็นตัวเลขไม่ติดลบ');
      await api('/api/accounts','POST',{name,kind,opening:op});closeSheet();toast('เพิ่มบัญชีแล้ว');render()});
    setTimeout(()=>{try{$('an').focus()}catch{}},60)})}

function openPay(i){
  if(!i)return;const mk=key(S.mBills);
  if(i.paid){
    sheet(`<div class="grab"></div><h2>${esc(i.name)}</h2>
    <p class="mu">จ่ายแล้ว ฿${fmt(i.amount)} · ${short(i.paidAt)}${i.accountId?' จาก '+an(i.accountId):''}</p>
    <p class="mu small">ติ๊กผิด? เอาติ๊กออกได้ ระบบจะยกเลิกรายจ่ายนี้และคืนยอดเข้าบัญชี</p>
    ${errBox}<button class="btn warn" id="up" style="margin-top:12px">เอาติ๊กออก</button>`,()=>
      arm($('up'),async()=>{await api(`/api/bills/${i.id}/pay/${i.occurrenceDate}`,'DELETE');closeSheet();toast('เอาติ๊กออกแล้ว');render()}));return}
  if(!S.accts.length){toast('เพิ่มบัญชีก่อน แล้วจึงติ๊กจ่ายได้');openAcct();return}
  const last=store.get('acct'),sel=S.accts.some(a=>a.id===i.accountId)?i.accountId:S.accts.some(a=>a.id===last)?last:S.accts[0].id;
  sheet(`<div class="grab"></div><h2>${esc(i.name)}</h2><p class="mu small" style="margin:0">กำหนดชำระ ${i.occurrenceDate}</p>
  <div class="amtbox"><span>฿</span><input id="am" class="amt" inputmode="decimal" value="${esc(String(Number(i.amount)))}" aria-label="จำนวนเงินที่จ่ายจริง"></div>
  <label class="fld"><span>จ่ายจากบัญชี</span><select id="fa" class="ip">${S.accts.map(a=>`<option value="${esc(a.id)}"${a.id===sel?' selected':''}>${esc(a.name)} · ฿${fmt(a.balance)}</option>`).join('')}</select></label>
  <p class="mu small">แก้จำนวนเงินได้ถ้าเดือนนี้จ่ายไม่เท่าเดิม เช่น ค่าไฟ · จะบันทึกเป็นรายจ่ายและตัดยอดบัญชีทันที</p>
  ${errBox}<button class="btn" id="sv">จ่ายแล้ว</button>`,()=>{
    $('sv').onclick=()=>run($('sv'),async()=>{const amount=cleanAmt($('am').value);
      if(!moneyOk(amount)||Number(amount)<=0)throw Error('ใส่จำนวนเงินให้ถูกต้อง');
      await api(`/api/bills/${i.id}/pay`,'POST',{occurrenceDate:i.occurrenceDate,amount,accountId:$('fa').value});
      store.set('acct',$('fa').value);closeSheet();toast('บันทึกเป็นรายจ่ายแล้ว');render()})})}

function openBill(i){
  const edit=!!i;let cat=(i&&i.category)||'',frequency=i?.frequency||'MONTHLY',weekday=i?.weekday??1;
  const list=cat&&!EXP.includes(cat)?[...EXP,cat]:EXP;
  const weekdays=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  sheet(`<div class="grab"></div><h2>${edit?'แก้ไขบิลประจำ':'เพิ่มบิลประจำ'}</h2>
  <input id="bn" class="ip" placeholder="ชื่อ เช่น ค่าเช่าห้อง, ค่าอินเทอร์เน็ต" maxlength="80" value="${edit?esc(i.name):''}" autocomplete="off" aria-label="ชื่อบิล">
  <label class="fld"><span>จำนวนเงินต่อครั้ง (บาท)</span><input id="ba" class="ip" inputmode="decimal" placeholder="0" value="${edit?esc(String(Number(i.planned))):''}" autocomplete="off"></label>
  <label class="fld"><span>ความถี่ในการหัก</span><select id="bf" class="ip"><option value="MONTHLY"${frequency==='MONTHLY'?' selected':''}>รายเดือน</option><option value="WEEKLY"${frequency==='WEEKLY'?' selected':''}>รายสัปดาห์</option></select></label>
  <label class="fld" id="monthlyWrap"${frequency==='WEEKLY'?' hidden':''}><span>หักทุกวันที่ (ของเดือน)</span><input id="bd" class="ip" type="number" min="1" max="31" value="${edit?i.dueDay:1}"></label>
  <label class="fld" id="weeklyWrap"${frequency!=='WEEKLY'?' hidden':''}><span>หักทุกวัน</span><select id="bw" class="ip">${weekdays.map((d,n)=>`<option value="${n}"${n===weekday?' selected':''}>ทุกวัน${d}</option>`).join('')}</select></label>
  <label class="fld"><span>หักจากบัญชีนี้เป็นค่าเริ่มต้น</span><select id="bc" class="ip"><option value="">เลือกบัญชี</option>${S.accts.map(a=>`<option value="${esc(a.id)}"${(edit?i.accountId===a.id:false)?' selected':''}>${esc(a.name)} · ฿${fmt(a.balance)}</option>`).join('')}</select></label>
  <div style="margin-top:14px"><div class="lb" style="margin-bottom:8px">หมวดหมู่ (ไม่บังคับ)</div>${chips(list,cat,'cc')}</div>
  <p class="mu small">ระบบจะแสดงกำหนดชำระตามรอบ และเมื่อกดจ่ายจะสร้างรายการรายจ่ายจริงพร้อมหักยอดจากบัญชีที่เลือก</p>
  ${errBox}<button class="btn" id="sv" style="margin-top:16px">${edit?'บันทึก':'เพิ่มบิลประจำ'}</button>${edit?'<button class="btn warn" id="dl">หยุดใช้บิลนี้</button>':''}`,()=>{
    bindChips('cc',v=>{cat=v});
    $('bf').onchange=()=>{const weekly=$('bf').value==='WEEKLY';$('monthlyWrap').hidden=weekly;$('weeklyWrap').hidden=!weekly};
    $('sv').onclick=()=>run($('sv'),async()=>{const name=$('bn').value.trim(),amount=cleanAmt($('ba').value),day=Number($('bd').value),freq=$('bf').value,accountId=$('bc').value;
      if(!name)throw Error('ใส่ชื่อบิล');if(!moneyOk(amount)||Number(amount)<=0)throw Error('ใส่จำนวนเงินให้ถูกต้อง');if(!accountId)throw Error('เลือกบัญชีที่จะหักเงิน');
      if(freq==='MONTHLY'&&(!Number.isInteger(day)||day<1||day>31))throw Error('วันที่หักต้องอยู่ระหว่าง 1–31');
      const b={name,amount,frequency:freq,dueDay:freq==='MONTHLY'?day:1,weekday:freq==='WEEKLY'?Number($('bw').value):null,accountId,category:cat||null};
      await api(edit?'/api/bills/'+i.id:'/api/bills',edit?'PUT':'POST',b);closeSheet();toast(edit?'บันทึกแล้ว':'เพิ่มบิลประจำแล้ว');render()});
    if(edit)arm($('dl'),async()=>{await api('/api/bills/'+i.id,'DELETE');closeSheet();toast('หยุดใช้บิลแล้ว');render()});
    else setTimeout(()=>{try{$('bn').focus()}catch{}},60)
  })}

function openSettings(){
  sheet(`<div class="grab"></div><h2>บัญชีผู้ใช้</h2><p class="mu" style="margin:0 0 4px">${esc(S.email)}</p>
  <p class="mu small" style="margin:0 0 18px">ข้อมูลของคุณแยกจากผู้ใช้คนอื่น มีแต่คุณที่มองเห็น</p>
  <a class="btn ghost" href="/api/export/transactions.csv" download>ส่งออกรายการเป็น CSV</a>
  <p class="mu small">ติดตั้งบน iPhone: เปิดด้วย Safari → ปุ่มแชร์ → เพิ่มลงในหน้าจอโฮม</p>
  <button class="btn warn" id="lo">ออกจากระบบ</button>`,()=>{
    $('lo').onclick=()=>run($('lo'),async()=>{await api('/api/auth/logout','POST',{});closeSheet();showAuth()})})}

/* ====================== render / routing ====================== */
async function render(){
  const tok=++S.tok,v=$('v');
  document.querySelectorAll('.nv a').forEach(a=>a.classList.toggle('on',a.dataset.t===S.tab));
  const sig=S.tab+'/'+(S.sub||'');if(S.sig!==sig){S.sig=sig;v.innerHTML='<div class="load">กำลังโหลด…</div>';scrollTo(0,0)}
  try{const view=S.tab==='list'?vList:S.tab==='bills'?vBills:S.tab==='reports'?vReports:S.tab==='accts'?(S.sub?vStmt:vAccts):vHome;
    const o=await view();if(tok!==S.tok)return;v.innerHTML=o.html;o.mount&&o.mount()}
  catch(e){if(tok!==S.tok)return;v.innerHTML=`<div class="empty"><b>โหลดข้อมูลไม่ได้</b>${esc(e.message)}<button class="btn ghost" data-retry>ลองใหม่</button></div>`}}
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/'),tab=['home','list','bills','accts','reports'].includes(h[0])?h[0]:'home';
  const sub=tab==='accts'&&/^[0-9a-f-]{36}$/i.test(h[1]||'')?h[1]:null;
  if(sub!==S.sub)S.mAcct=cur();S.tab=tab;S.sub=sub;closeSheet();render()}
addEventListener('hashchange',()=>{if(!$('app').classList.contains('hide'))route()});

$('nvi').innerHTML=`<a href="#/home" data-t="home">${I.home}<span>ภาพรวม</span></a><a href="#/list" data-t="list">${I.list}<span>รายการ</span></a>
<button id="add" aria-label="เพิ่มรายการ">${I.plus}</button><a href="#/bills" data-t="bills">${I.bills}<span>บิลประจำ</span></a><a href="#/accts" data-t="accts">${I.wallet}<span>บัญชี</span></a><a href="#/reports" data-t="reports">${I.list}<span>รายงาน</span></a>`;
$('add').onclick=()=>openAdd(S.tab==='list'&&S.seg==='INCOME'?'INCOME':'EXPENSE');
$('v').addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
  if(x=g('[data-m]')){S[x.dataset.m]=shift(S[x.dataset.m],+x.dataset.d);render();return}
  if(x=g('[data-tx]')){openTx(x.dataset.tx);return}
  if(x=g('[data-pay]')){const [id,date]=x.dataset.pay.split('|');const item=S.bills.get(id+'|'+date);if(item)openPay(item);return}
  if(x=g('[data-bill]')){openBill([...S.bills.values()].find(v=>v.id===x.dataset.bill));return}
  if(g('[data-newbill]')){openBill();return}
  if(g('[data-newacct]')){openAcct();return}
  if(g('[data-me]')){openSettings();return}
  if(g('[data-retry]'))render()});

/* ====================== auth ====================== */
function showAuth(){S.sig='';$('app').classList.add('hide');$('auth').classList.remove('hide');setReg(S.reg)}
function setReg(on){S.reg=on;$('aseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.r==='1')===on));
  $('asub').textContent=on?'สร้างบัญชี':'เข้าสู่ระบบ';$('ahint').hidden=!on;$('aerr').hidden=true;
  $('pw').autocomplete=on?'new-password':'current-password'}
const authErr=m=>{$('aerr').textContent=m;$('aerr').hidden=false};
$('aseg').onclick=e=>{const b=e.target.closest('[data-r]');if(b)setReg(b.dataset.r==='1')};
$('af').onsubmit=async e=>{e.preventDefault();$('aerr').hidden=true;
  const email=$('em').value.trim(),password=$('pw').value;
  if(!email||!password)return authErr('กรอกอีเมลและรหัสผ่าน');
  if(S.reg&&password.length<10)return authErr('รหัสผ่านต้องมีอย่างน้อย 10 ตัวอักษร');
  const b=$('asub');b.disabled=true;
  try{await api(S.reg?'/api/auth/register':'/api/auth/login','POST',{email,password});$('pw').value='';await boot()}
  catch(er){authErr(er.message==='ข้อมูลไม่ถูกต้อง'?'ตรวจอีเมลและรหัสผ่านอีกครั้ง':er.message)}
  finally{b.disabled=false}};

async function boot(){
  try{const me=await api('/api/me');S.email=me.email||'';$('auth').classList.add('hide');$('app').classList.remove('hide');route()}
  catch{showAuth()}}
addEventListener('online',()=>$('off').style.display='none');
addEventListener('offline',()=>$('off').style.display='block');
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
boot();
</script>
</body>
</html>
