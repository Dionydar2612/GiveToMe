<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Givetome</title><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Givetome"><link rel="apple-touch-icon" href="/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f4;--sf:#fff;--ink:#15201b;--mute:#69736d;--line:#e3e7e4;--ac:#1d6b4f;--acs:#e4f0ea;--out:#b5473a;--warn:#b7791f;--sh:0 -8px 30px #0002;
 --f:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0f1311;--sf:#171c19;--ink:#e8ece9;--mute:#8d9792;--line:#262d29;--ac:#5db28d;--acs:#1b2b24;--out:#e07a6c;--warn:#e0b04a;--sh:0 -8px 30px #0008}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{margin:0;font:400 16px/1.5 var(--f);background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}.hide{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:560px;margin:auto;padding:0 18px}
/* หัวหน้า */
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
#bar .wrap{display:flex;align-items:center;gap:6px;min-height:40px}
#ttl{font-size:20px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.ib{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);margin-left:-10px}
.ib:active{background:var(--line)}
#off{background:var(--warn);color:#fff;text-align:center;font-size:14px;padding:6px 12px;font-weight:500}
body:not(.offline) #off{display:none}
/* เนื้อหา */
h2{font-size:14px;font-weight:600;color:var(--mute);margin:26px 0 6px}
.hero{padding:14px 0 4px}.hero .l{color:var(--mute);font-size:14px}
.hero .n{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.15}.hero .n small{font-size:22px;color:var(--mute);font-weight:500}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}.meter i{display:block;height:100%;background:var(--ac);border-radius:4px}
.meter.over i{background:var(--out)}.meter.near i{background:var(--warn)}
.m{color:var(--mute);font-size:14px}.in{color:var(--ac)}.out{color:var(--out)}.warn{color:var(--warn)}
.list{background:var(--sf);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}button.row:active{background:var(--bg)}
.row .t{flex:1;min-width:0}.row .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t span{display:block}
.row .a{font-weight:500;white-space:nowrap;text-align:right}.row .a small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.row .chev{color:var(--mute);margin-right:-4px}.void{opacity:.45;text-decoration:line-through}
.day{font-size:13px;color:var(--mute);margin:18px 2px 6px}
.empty{background:var(--sf);border-radius:16px;padding:22px 18px;text-align:center;color:var(--mute)}.empty b{color:var(--ink);display:block;margin-bottom:4px}
.empty .btn{margin-top:14px}
.err{background:var(--sf);border-radius:16px;padding:16px;color:var(--out)}
/* ปุ่ม/ฟอร์ม */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;font-weight:500;text-align:center;margin-top:10px}
.btn.ghost{background:none;color:var(--ac);box-shadow:inset 0 0 0 1px var(--line)}.btn.danger{color:var(--out)}.btn.danger.armed{background:var(--out);color:#fff;box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;margin:0;font-size:14px}
input,select{width:100%;padding:12px 14px;margin:5px 0;border:1px solid var(--line);border-radius:12px;background:var(--sf);font-size:16px}
input:focus,select:focus{border-color:var(--ac);outline:0}.amt{font-size:32px;font-weight:600;border:0;background:none;padding:6px 0;letter-spacing:-.02em}
.f{display:block;margin-top:6px}.f>span{font-size:13px;color:var(--mute)}.f select,.f input{margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;margin:4px 0 8px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;color:var(--mute);font-size:15px}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:500;box-shadow:0 1px 2px #0002}
.step{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}.step b{font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mute);background:none;display:grid;place-items:center;flex:none;padding:0;color:#fff}
.chk.paid{background:var(--ac);border-color:var(--ac)}.chk.partial{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.chk svg{display:none}.chk.paid svg{display:block}
.legend{display:flex;align-items:center;gap:10px;font-size:15px;padding:5px 0}.legend i{width:10px;height:10px;border-radius:3px;flex:none}.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--sf);border-radius:16px;padding:16px}.card+.card{margin-top:10px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
/* ปุ่มเพิ่ม + แท็บล่าง */
#fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px #0003}
@media(prefers-color-scheme:dark){#fab{color:#0b1410}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .wrap{display:flex;padding:0 6px}nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac);font-weight:600}
/* bottom sheet */
dialog{border:0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));background:var(--sf);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:92vh;box-shadow:var(--sh)}
dialog::backdrop{background:#0006}dialog h3{margin:2px 0 8px;font-size:19px;font-weight:600}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 12px}
.offnote{display:none;color:var(--warn);font-size:14px;margin-top:8px}.offline .offnote{display:block}
.save .offl{display:none}.offline .save{background:var(--line);color:var(--mute);pointer-events:none}.offline .save .onl{display:none}.offline .save .offl{display:inline}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:20;max-width:90%;text-align:center}
/* login */
#auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 0}#auth h1{font-size:30px;margin:0;letter-spacing:-.02em}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style></head><body>
<div id="toast" class="hide" role="status"></div>
<div id="off" role="alert">ออฟไลน์ — บันทึกไม่ได้จนกว่าจะเชื่อมต่ออีกครั้ง</div>

<section id="auth" class="hide"><div class="wrap">
 <h1>Givetome</h1><p class="m" style="margin:2px 0 22px">สมุดบัญชีส่วนตัว บันทึกรายรับ รายจ่าย และวางแผนเงินในที่เดียว</p>
 <div class="seg"><button type="button" data-a="authMode" data-m="login" class="on" id="m-login">เข้าสู่ระบบ</button><button type="button" data-a="authMode" data-m="register" id="m-register">สมัครใช้งาน</button></div>
 <input id="em" type="email" placeholder="อีเมล" autocomplete="username"><input id="pw" type="password" placeholder="รหัสผ่าน อย่างน้อย 10 ตัวอักษร" autocomplete="current-password">
 <button class="btn save" id="go" data-a="authGo"><span class="onl">เข้าสู่ระบบ</span><span class="offl">ออฟไลน์</span></button>
 <p class="m" id="ahint" style="margin-top:14px">ข้อมูลของแต่ละบัญชีแยกจากกัน คนอื่นมองไม่เห็นรายการของคุณ</p>
</div></section>

<section id="app" class="hide">
 <header id="bar"><div class="wrap"><button class="ib hide" id="back" data-a="back" aria-label="ย้อนกลับ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="ttl"></h1><span id="act"></span></div></header>
 <main class="wrap" id="v"></main>
 <button id="fab" data-a="add" aria-label="เพิ่มรายการ"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
 <nav><div class="wrap" id="tabs"></div></nav>
</section>
<dialog id="sheet"></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=s=>Number(String(s).replace(/,/g,''));
const fmt=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
const TL={INCOME:'รายรับ',EXPENSE:'รายจ่าย',TRANSFER:'โอน',REFUND:'รับคืน',ADJUST:'ปรับยอด'};
const DEF_CATS=['อาหาร','เดินทาง','ค่าห้อง/น้ำไฟ','ค่าโทรศัพท์/เน็ต','ซื้อของ','ผ่อนหนี้','ความบันเทิง','สุขภาพ','การเรียน','เงินออม','เงินเดือน','อื่น ๆ'];
const KINDS=['เงินเดือน','ใช้จ่าย','เงินออม','เงินสด','กระเป๋าเงิน'];
const COL=['#1d6b4f','#4c9a7b','#8cbfa9','#c9a24b','#b5473a','#7c8c86'];
const I={chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
 ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'};
const ico=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TABS=[['home','ภาพรวม',ico('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>')],['txs','รายการ',ico('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>')],
 ['list','เช็คลิสต์',ico('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>')],['rep','รายงาน',ico('<path d="M5 20V10M12 20V4M19 20v-7"/>')],['more','เพิ่มเติม',ico('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>')]];
const TITLE={home:'ภาพรวม',txs:'รายการ',list:'เช็คลิสต์รายเดือน',rep:'รายงาน',more:'เพิ่มเติม',accts:'บัญชีของฉัน',acct:'รายการเดินบัญชี',budget:'งบประมาณ',goals:'เป้าหมายออม',salary:'เงินเดือนและรอบเงินเดือน',bills:'บิลประจำ'};
const S={stack:[{v:'home'}],accts:[],tot:{income:'0',expense:'0'},cats:[...DEF_CATS],tok:0,mode:'login',txf:{type:'EXPENSE',month:null,q:'',acc:''},ckm:null,tx:new Map(),me:null};
const bkkNow=()=>new Date(Date.now()+7*36e5),thisMonth=()=>bkkNow().toISOString().slice(0,7);
const monthShift=(k,d)=>{const[y,m]=k.split('-').map(Number),x=new Date(Date.UTC(y,m-1+d,1));return x.toISOString().slice(0,7)};
const monthName=k=>{const[y,m]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,15)).toLocaleDateString('th-TH',{month:'long',year:'numeric',timeZone:'UTC'})};
const monthRange=k=>{const[y,m]=k.split('-').map(Number);return[new Date(Date.UTC(y,m-1,1)-7*36e5).toISOString(),new Date(Date.UTC(y,m,1)-7*36e5-1).toISOString()]};
const dShort=d=>new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const dLong=d=>new Date(d).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
const dayKey=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
function toast(m,ms=3200){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),ms)}
function friendly(j){const d=j.details&&j.details[0];if(!d)return j.error||'เกิดข้อผิดพลาด';const k=d.path&&d.path[0];
 return k==='password'?'รหัสผ่านต้องยาวอย่างน้อย 10 ตัวอักษร':k==='email'?'อีเมลไม่ถูกต้อง':/amount|target|opening/.test(k)?'จำนวนเงินไม่ถูกต้อง':(d.message||j.error)}
async function api(p,m='GET',b){
 if(!navigator.onLine)throw Error(m==='GET'?'ออฟไลน์ — ดูข้อมูลไม่ได้':'ออฟไลน์ — บันทึกไม่ได้ ข้อมูลที่กรอกยังอยู่ในหน้านี้');
 let r;try{r=await fetch(p,{method:m,credentials:'same-origin',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined})}
 catch{throw Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ยังไม่ได้บันทึก ลองใหม่อีกครั้ง')}
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&!p.startsWith('/api/auth/')){show('auth');throw Error('กรุณาเข้าสู่ระบบ')}
 if(!r.ok)throw Error(friendly(j));return j}
function show(w){$('auth').classList.toggle('hide',w!=='auth');$('app').classList.toggle('hide',w!=='app')}
const saveBtn=(label,act,data='')=>`<button class="btn save" data-a="${act}" ${data}><span class="onl">${label}</span><span class="offl">ออฟไลน์ — บันทึกไม่ได้</span></button><div class="offnote">ข้อมูลที่กรอกยังอยู่ กลับมาออนไลน์แล้วกดบันทึกได้เลย</div>`;
function sheet(html){const d=$('sheet');d.innerHTML='<div class="grab"></div>'+html;if(!d.open)d.showModal()}
const closeSheet=()=>{const d=$('sheet');if(d.open)d.close()};
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
const opts=(arr,sel)=>arr.map(a=>`<option value="${esc(a.id)}"${a.id===sel?' selected':''}>${esc(a.name)}</option>`).join('');
const catList=()=>`<datalist id="cl">${S.cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
const an=id=>esc((S.accts.find(a=>a.id===id)||{}).name||'-');

/* ---------- เส้นทางหน้า ---------- */
const cur=()=>S.stack[S.stack.length-1];
const tab=v=>{S.stack=[{v}];render()};
const push=(v,arg)=>{S.stack.push({v,arg});render()};
async function loadAccts(){const a=await api('/api/accounts');S.accts=a.accounts;S.tot=a.totals}
async function render(){
 const{v,arg}=cur(),tok=++S.tok,root=S.stack.length===1;
 $('tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-a="tab" data-v="${k}" class="${(S.stack[0].v===k)?'on':''}" aria-label="${l}">${i}<span>${l}</span></button>`).join('');
 $('back').classList.toggle('hide',root);$('ttl').textContent=TITLE[v]||'';$('act').innerHTML='';$('fab').classList.toggle('hide',!['home','txs','acct'].includes(v));
 $('v').innerHTML='<p class="m" style="margin-top:24px">กำลังโหลด…</p>';
 try{await loadAccts();const[html,mount]=await P[v](arg,tok);if(tok!==S.tok)return;$('v').innerHTML=html;mount&&mount();scrollTo(0,0)}
 catch(e){if(tok===S.tok)$('v').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
const reload=()=>{const t=scrollY;return render().then(()=>scrollTo(0,t))};

/* ---------- ส่วนประกอบ ---------- */
function txRow(t,o={}){S.tx.set(t.id,t);const v=t.status==='VOID',ex=t.type==='EXPENSE',tr=t.type==='TRANSFER';
 const amt=o.amt??((ex?'−':tr?'':'+')+fmt(t.amount)),cls=o.cls??(ex?'out':tr?'':'in');
 const acc=tr?an(t.fromAccountId)+' → '+an(t.toAccountId):an(t.fromAccountId||t.toAccountId);
 const meta=[t.category||TL[t.type],o.noAcc?'':acc,v?'ยกเลิกแล้ว':''].filter(Boolean).join(' · ');
 return `<button class="row ${v?'void':''}" data-a="tx" data-id="${esc(t.id)}"><span class="t"><b>${esc(t.title)}</b><span class="m">${esc(meta)}${t.note?' · '+esc(t.note):''}</span></span><span class="a ${cls}">${amt}${o.sub?`<small>${o.sub}</small>`:''}</span></button>`}
function byDay(items,fn){let last='',h='';for(const t of items){const k=dayKey(t.occurredAt);if(k!==last){if(last)h+='</div>';h+=`<div class="day">${dLong(t.occurredAt)}</div><div class="list">`;last=k}h+=fn(t)}return h+(last?'</div>':'')}
const empty=(t,s,btn)=>`<div class="empty"><b>${t}</b>${s||''}${btn||''}</div>`;
const prog=(pct,cls='')=>`<div class="meter ${cls}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,Math.max(pct?2:0,pct))}%"></i></div>`;
const link=(t,s,act,data='')=>`<button class="row" data-a="${act}" ${data}><span class="t"><b>${t}</b>${s?`<span class="m">${s}</span>`:''}</span>${I.chev}</button>`;

const P={};
/* ภาพรวม */
P.home=async()=>{
 const[tx,cy,ck,bg]=await Promise.all([api('/api/transactions'),api('/api/cycle'),api('/api/checklist?month='+thisMonth()),api('/api/budgets')]);
 const total=S.accts.reduce((s,a)=>s+num(a.balance),0),[i,d]=fmt(total).split('.');
 const el=Math.round((Date.now()-new Date(cy.start))/(new Date(cy.end)-new Date(cy.start))*100);
 const risky=bg.budgets.filter(b=>b.state!=='ok').slice(0,2);
 let h=`<div class="hero"><div class="l">ยอดเงินรวมทุกบัญชี</div><div class="n">฿${i}<small>.${d}</small></div>
  <div class="m" style="margin-top:8px">${cy.hasSalary?`อีก ${cy.daysLeft} วันถึงเงินเดือนรอบถัดไป`:`อีก ${cy.daysLeft} วันสิ้นเดือน`}</div>${prog(el)}
  <div class="m">${cy.hasSalary?'รอบนี้':'เดือนนี้'}ใช้ไป <b class="out">฿${fmt(cy.expense)}</b> · รับ <b class="in">฿${fmt(cy.income)}</b></div></div>`;
 if(!S.accts.length)return[h+empty('เริ่มจากเพิ่มบัญชีแรก','เช่น บัญชีเงินเดือน หรือเงินสดในกระเป๋า',`<button class="btn" data-a="newAcct">เพิ่มบัญชี</button>`)];

/* รายงาน (กราฟ SVG) */
function donut(rows,total){const R=46,C=2*Math.PI*R;let off=0;const top=rows.slice(0,5),rest=rows.slice(5).reduce((s,r)=>s+num(r.amount),0),segs=[...top.map(r=>({n:r.name,v:num(r.amount)})),...(rest>0?[{n:'อื่น ๆ',v:rest}]:[])];
 const arcs=segs.map((s,i)=>{const len=s.v/total*C,x=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COL[i]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return x}).join('');
 return `<div style="display:flex;gap:16px;align-items:center"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="สัดส่วนรายจ่ายตามหมวด">${arcs}</svg><div style="flex:1;min-width:0">${segs.map((s,i)=>`<div class="legend"><i style="background:${COL[i]}"></i><span>${esc(s.n)}</span><b style="font-weight:500">${Math.round(s.v/total*100)}%</b></div>`).join('')}</div></div>`}
function bars(items,twin){const W=320,H=120,max=Math.max(1,...items.map(i=>Math.max(i.a,i.b||0))),n=items.length,g=W/n,bw=Math.min(twin?10:18,g*(twin?.36:.62)),every=Math.ceil(n/7);
 return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="กราฟแท่ง" style="display:block"><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>${items.map((it,i)=>{const cx=g*i+g/2,h1=it.a/max*(H-6),h2=(it.b||0)/max*(H-6);
  return (twin?`<rect x="${cx-bw-1}" y="${H-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--ac)"/><rect x="${cx+1}" y="${H-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--out)"/>`:`<rect x="${cx-bw/2}" y="${H-h1}" width="${bw}" height="${Math.max(h1,it.a>0?2:0)}" rx="2" fill="var(--out)"/>`)+(i%every===0?`<text x="${cx}" y="${H+14}" font-size="10" text-anchor="middle" fill="var(--mute)">${esc(it.l)}</text>`:'')}).join('')}</svg>`}
P.rep=async()=>{const per=S.per||'m',n=bkkNow(),y=n.getUTCFullYear(),m=n.getUTCMonth(),d=n.getUTCDate();
 let from=new Date(Date.UTC(y,m,d)-7*36e5);if(per==='w')from=new Date(from.getTime()-6*864e5);if(per==='m')from=new Date(Date.UTC(y,m,1)-7*36e5);if(per==='y')from=new Date(Date.UTC(y,0,1)-7*36e5);
 const to=new Date(Date.UTC(y,m,d+1)-7*36e5-1),days=Math.max(1,Math.round((to-from)/864e5));
 const[s,mo]=await Promise.all([api('/api/summary?from='+encodeURIComponent(from.toISOString())+'&to='+encodeURIComponent(to.toISOString())),api('/api/reports/monthly?months='+(per==='y'?12:6))]);
 const ex=num(s.expense),top=s.byCategory[0],MN=k=>new Date(Date.UTC(+k.slice(0,4),+k.slice(5)-1,15)).toLocaleDateString('th-TH',{month:'short',timeZone:'UTC'});
 const dm=new Map(s.byDay.map(x=>[x.date,num(x.expense)])),dayBars=[];for(let i=0;i<days&&i<31;i++){const t=new Date(to.getTime()-(Math.min(days,31)-1-i)*864e5),k=dayKey(t);dayBars.push({l:+k.slice(8),a:dm.get(k)||0})}
 const h=`<div class="seg">${[['w','7 วัน'],['m','เดือนนี้'],['y','ปีนี้']].map(([k,l])=>`<button data-a="per" data-k="${k}" class="${per===k?'on':''}">${l}</button>`).join('')}</div>
 <div class="card"><div style="display:flex;justify-content:space-between"><span class="m">รายรับ</span><b class="in">฿${fmt(s.income)}</b></div><div style="display:flex;justify-content:space-between"><span class="m">รายจ่าย</span><b class="out">฿${fmt(s.expense)}</b></div><div style="display:flex;justify-content:space-between"><span class="m">คงเหลือสุทธิ</span><b>฿${fmt(s.net)}</b></div>
 <p class="m" style="margin:10px 0 0">${ex?`ใช้เฉลี่ยวันละ ฿${fmt(ex/days)}${top?` · มากสุดคือ “${esc(top.name)}” (${Math.round(num(top.amount)/ex*100)}%)`:''}`:'ยังไม่มีรายจ่ายในช่วงนี้'}${num(s.net)<0?' · ช่วงนี้จ่ายมากกว่ารับ':''}</p></div>
 ${ex?`<h2>รายจ่ายตามหมวด</h2><div class="card">${donut(s.byCategory,ex)}</div>`:''}
 ${per==='y'?`<h2>รายเดือน (เขียว = รับ, แดง = จ่าย)</h2><div class="card">${bars(mo.map(x=>({l:MN(x.month),a:num(x.expense),b:num(x.income)})),true)}</div>`
  :`<h2>รายจ่ายรายวัน</h2><div class="card">${bars(dayBars)}</div><h2>6 เดือนล่าสุด (เขียว = รับ, แดง = จ่าย)</h2><div class="card">${bars(mo.map(x=>({l:MN(x.month),a:num(x.expense),b:num(x.income)})),true)}</div>`}

 return[h]};

 sheet(`<h3>เพิ่มรายการ</h3><div class="seg">${[['EXPENSE','รายจ่าย'],['INCOME','รายรับ'],['TRANSFER','โอนเงิน']].map(([k,l])=>`<button type="button" data-a="addType" data-k="${k}" class="${k===S.addType?'on':''}">${l}</button>`).join('')}</div>
 <input id="am" class="amt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="จำนวนเงิน"><input id="ti" placeholder="จ่ายอะไร เช่น ข้าวกลางวัน" maxlength="120"><input id="ct" list="cl" placeholder="หมวดหมู่ (ไม่บังคับ)" maxlength="60">${catList()}
 <label class="f" id="fal"><span id="fl">จ่ายจากบัญชี</span><select id="fa">${opts(S.accts,pre.accountId)}</select></label><label class="f hide" id="tal"><span id="tl">เข้าบัญชี</span><select id="ta">${opts(S.accts,pre.accountId)}</select></label>
 <label class="f"><span>วันที่และเวลา</span><input id="dt" type="datetime-local" value="${loc}"></label><input id="nt" placeholder="โน้ต (ไม่บังคับ)" maxlength="500">${saveBtn('บันทึก','saveTx')}`);
 setTimeout(()=>$('am')?.focus(),50);addType(S.addType)}

 $('fal').classList.toggle('hide',k==='INCOME');$('tal').classList.toggle('hide',k==='EXPENSE');$('fl').textContent=k==='TRANSFER'?'จากบัญชี':'จ่ายจากบัญชี';$('tl').textContent=k==='TRANSFER'?'ไปยังบัญชี':'เข้าบัญชี';
 $('ti').placeholder=k==='EXPENSE'?'จ่ายอะไร เช่น ข้าวกลางวัน':k==='INCOME'?'รับอะไร เช่น เงินเดือน':'เช่น เติมเงินกระเป๋า'}
function openTx(id){const t=S.tx.get(id);if(!t)return;const v=t.status==='VOID';

 ${v?'':`<label class="f"><span>จำนวนเงิน (บาท)</span><input id="eam" inputmode="decimal" value="${t.amount}"></label><label class="f"><span>ชื่อรายการ</span><input id="eti" value="${esc(t.title)}" maxlength="120"></label>
 <label class="f"><span>หมวดหมู่</span><input id="ect" list="cl" value="${esc(t.category||'')}" maxlength="60"></label>${catList()}<label class="f"><span>โน้ต</span><input id="ent" value="${esc(t.note||'')}" maxlength="500"></label>
 ${saveBtn('บันทึกการแก้ไข','updTx',`data-id="${esc(id)}"`)}<button class="btn ghost danger save" data-a="arm" data-then="voidTx" data-id="${esc(id)}"><span class="onl">ยกเลิกรายการนี้</span><span class="offl">ออฟไลน์</span></button>

let busy=false;
async function run(f){if(busy)return;busy=true;try{await f()}catch(e){toast(e.message)}finally{busy=false}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset,el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#em,#pw'))A.authGo()});

/* ---------- ออนไลน์/ออฟไลน์: ขณะออฟไลน์บันทึกไม่ได้และแจ้งเตือน ---------- */
function net(){const off=!navigator.onLine;document.body.classList.toggle('offline',off)}
addEventListener('offline',()=>{net();toast('ออฟไลน์ — บันทึกไม่ได้จนกว่าจะเชื่อมต่ออีกครั้ง',5000)});
addEventListener('online',()=>{net();toast('กลับมาออนไลน์แล้ว');if(!$('app').classList.contains('hide'))reload()});
async function boot(){net();try{S.me=await api('/api/me');show('app');api('/api/categories').then(c=>{S.cats=[...new Set([...DEF_CATS,...c])]}).catch(()=>{});render()}catch{show('auth')}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');boot();
</script></body></html>
