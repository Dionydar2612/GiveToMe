services:
  - type: web
    name: givetome
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set this manually in Render to the existing Supabase connection string.
      # sync:false prevents this Blueprint from silently replacing it with a new database.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
